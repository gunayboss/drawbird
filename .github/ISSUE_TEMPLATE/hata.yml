name: Hata bildir
description: Bir şey beklediğin gibi çalışmadı mı? Anlat, bakalım.
title: "[Hata] "
labels: ["hata"]
body:
  - type: markdown
    attributes:
      value: |
        Teşekkürler! Ne kadar ayrıntı verirsen o kadar çabuk bulabiliriz.
        Uygunsuz bir çizim gördüysen burayı kullanma, sitedeki iletişim formundan yaz.
  - type: textarea
    id: ne-oldu
    attributes:
      label: Ne oldu?
      description: Ne bekliyordun, ne gördün?
    validations:
      required: true
  - type: textarea
    id: adimlar
    attributes:
      label: Nasıl tekrar edebiliriz?
      placeholder: |
        1. Şuraya git
        2. Şuna bas
        3. Şunu gör
    validations:
      required: true
  - type: input
    id: tarayici
    attributes:
      label: Tarayıcı ve cihaz
      placeholder: Chrome 130, Android telefon
    validations:
      required: true
  - type: input
    id: dil
    attributes:
      label: Hangi dilde kullanıyordun?
      placeholder: Türkçe, English, ...
  - type: input
    id: kus
    attributes:
      label: İlgili kuşun linki (varsa)
      placeholder: https://drawbird.the-pit.workers.dev/k/...
